{% extends 'base.html' %}
{% block title %}Jugando {{ game.title }}{% endblock %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;">
    <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 1rem; align-items: center;">
        <h2 style="font-weight: 800;">🎮 {{ game.title }}</h2>
        <a href="{{ url_for('game_details', game_id=game.id) }}" class="btn-upload">Volver a los Detalles</a>
    </div>
    
    <div style="width: 100%; height: 75vh; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--accent); box-shadow: 0 10px 40px rgba(0, 229, 255, 0.2);">
        <iframe src="{{ play_url }}" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>
{% endblock %}
